name: opentransit_mobile
description: Open-source, multi-city, multimodal public transport trip planner (mobile app).
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  maplibre_gl: ^0.27.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0
  dio: ^5.11.1
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  flutter_local_notifications: ^22.3.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fixtures/
