name: Bug report
description: Something in the app is broken
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: App version / commit, placeholder: "1.2.0 (abc1234)" }
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [iOS, Android, Both] }
    validations: { required: true }
  - type: input
    id: city
    attributes: { label: City, placeholder: bogota }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, description: What did you do, what happened, what did you expect? }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Logs / screenshots }
