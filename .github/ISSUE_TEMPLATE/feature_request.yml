name: Feature request
description: Propose an improvement to the mobile app
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do that the app makes hard? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
  - type: dropdown
    id: scope
    attributes: { label: Does it need API changes?, options: [No, Yes, Not sure] }
