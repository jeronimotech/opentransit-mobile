name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  build-android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug --dart-define=MOCK=true
      # The wear module is not a dependency of :app, so it needs its own build
      # to catch breakage. It also proves the phone build stays independent.
      - name: Build the Wear OS app
        run: cd android && ./gradlew :wear:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-mock.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@v7
        with:
          name: wear-debug.apk
          path: build/wear/outputs/apk/debug/wear-debug.apk

  build-ios:
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
      - run: flutter pub get
      # A device build, not --simulator: with a watchOS companion in the project
      # the Flutter tool refuses a simulator build without a concrete device id
      # ("A device ID is required to build an app with a watchOS companion app").
      # This is also the configuration we actually ship.
      - run: flutter build ios --release --no-codesign --dart-define=MOCK=true
